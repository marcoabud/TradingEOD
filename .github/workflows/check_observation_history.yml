name: Check Observation History

on:
  push:
    branches: [main]
    paths:
      - 'src/observation.py'
      - '.github/workflows/check_observation_history.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  history:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Rebuild history from existing artifacts without broker access
        timeout-minutes: 4
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EOD_OBSERVATION_START_DATE: '2026-10-23'
        run: python -m src.observation --campaign --history-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: observation-history-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: paper_observation_campaign.json
          if-no-files-found: error
          retention-days: 90
