name: Check Paper Connection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/diagnostics.py'
      - '.github/workflows/check_connection.yml'

permissions:
  contents: read

jobs:
  read-only-paper-check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONUNBUFFERED: '1'
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      # Fixed paper endpoint: this workflow cannot opt into live trading.
      ALPACA_PAPER: 'true'
      ALPACA_DATA_FEED: 'iex'
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TRADINGEOD || secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Read paper account connectivity and confirm Telegram
        # Diagnostics does not submit/cancel orders, claim a trading date, or
        # evaluate signals. The market-data feed is not queried by this check.
        run: python -m src.diagnostics
      - name: Preserve connectivity summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: connectivity-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: connectivity_summary.json
          if-no-files-found: warn
          retention-days: 30
